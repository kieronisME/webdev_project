name: Checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - name: Check out the code
      uses: actions/checkout@v7

    - name: backend checking for node 
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: fresh install of dependencies
      run: npm ci



  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        
      - name: Build the production image
        run: docker build --target production -t webdev_project . 
  
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checking code
      uses: actions/checkout@v7

    - name: frontend checking for node  
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: fresh install of dependencies
      run: npm ci